<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14291d">
<meta name="description" content="தென்னங்கன்றுகள் மற்றும் இயற்கை எண்ணெய் வகைகள் வாங்க தென்னை SSP மயில்சாமியைத் தொடர்புகொள்ளுங்கள்.">
<title>SPM Samy Gold · தென்னை SSP மயில்சாமி</title>
<style>
  :root {
    color-scheme: dark;
    --forest: #14291d;
    --gold: #f6da88;
    --cream: #fff8e8;
    --muted: #cbd5c4;
    font-family: "Noto Sans Tamil", "Nirmala UI", "Tamil Sangam MN", Latha, system-ui, sans-serif;
    background: var(--forest);
    color: var(--cream);
  }
  * { box-sizing: border-box; }
  body, h1, p { margin: 0; }
  main {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-rows: clamp(290px, 51svh, 450px) auto;
    max-width: 1600px;
    margin: auto;
  }
  .scene {
    position: relative;
    grid-area: 1 / 1;
    overflow: hidden;
    z-index: -1;
    background: #314634;
  }
  .scene img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 55% 58%;
  }
  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #0b241bd9, #0b241b4d 47%, transparent 78%),
                linear-gradient(0deg, var(--forest), transparent 34%);
  }
  .brand {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    padding: 20px clamp(18px, 6vw, 36px) 12px;
  }
  .logo {
    display: block;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 4px #fff8e82e;
  }
  .brand-top { display: flex; align-items: center; gap: 14px; }
  .brand-top .logo { flex-shrink: 0; }
  .motto {
    padding: 8px 12px;
    border-left: 2px solid var(--gold);
    border-radius: 0 6px 6px 0;
    background: #14291de8;
    color: var(--gold);
    font-size: .875rem;
    font-weight: 650;
    line-height: 1.5;
    max-width: 29ch;
  }
  .actions[lang="en"] { font-family: system-ui, sans-serif; }
  .category { margin-bottom: 9px; color: var(--gold); font-size: .875rem; font-weight: 700; }
  h1 {
    color: var(--cream);
    font: normal clamp(2.8rem, 10.7vw, 4.25rem)/.91 Georgia, serif;
    letter-spacing: -.055em;
  }
  h1 span { display: block; color: var(--gold); }
  .name { margin-top: 12px; color: #f0f3e9; font-size: .94rem; font-weight: 600; }
  .actions {
    grid-area: 2 / 1;
    display: grid;
    gap: 9px;
    padding: 15px clamp(18px, 6vw, 36px) 24px;
  }
  .action {
    display: grid;
    grid-template-columns: 37px 1fr auto;
    align-items: center;
    gap: 9px;
    min-height: 58px;
    padding: 9px 13px;
    border-radius: 13px;
    border: 1px solid #ffffff32;
    text-decoration: none;
    color: var(--cream);
    background: #ffffff0b;
    transition: background-color 160ms ease, border-color 160ms ease;
  }
  .action strong { font-size: 1rem; }
  .action small { color: var(--muted); font-size: .875rem; text-align: right; }
  .action svg { width: 23px; height: 23px; color: var(--gold); margin: auto; }
  .action.call { background: var(--gold); color: #18291e; border-color: var(--gold); }
  .call small, .call svg { color: inherit; }
  .call small { font-variant-numeric: tabular-nums; font-weight: 650; }
  .action:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  @media (hover: hover) {
    .action:hover { background-color: #ffffff1d; border-color: var(--gold); }
    .action.call:hover { background-color: #ffe8a8; }
  }
  @media (max-width: 759px) {
    main { grid-template-rows: auto clamp(290px, 51svh, 450px) auto; }
    .brand { display: contents; }
    .brand-top {
      grid-area: 1 / 1;
      padding: 12px clamp(18px, 6vw, 36px);
    }
    .brand-top .logo { width: 52px; height: 52px; }
    .motto { background: transparent; padding-block: 0; max-width: none; }
    .scene, .brand-copy { grid-area: 2 / 1; }
    .brand-copy {
      align-self: end;
      padding: 0 clamp(18px, 6vw, 36px) 12px;
    }
    .actions { grid-area: 3 / 1; }
  }
  @media (min-width: 760px) {
    main {
      min-height: 100svh;
      grid-template-columns: 53% 47%;
      grid-template-rows: 1fr auto 1fr;
    }
    .scene { grid-area: 1 / 2 / -1 / -1; }
    .scene img { object-position: 60% 55%; }
    .scene::after {
      background: linear-gradient(90deg, var(--forest), transparent 34%),
                  linear-gradient(0deg, #10241b90, transparent 28%);
    }
    .brand {
      grid-area: 1 / 1 / 3 / 2;
      align-self: end;
      justify-content: flex-start;
      gap: clamp(26px, 5vh, 58px);
      padding: 52px 20px 0 clamp(38px, 9vw, 155px);
    }
    .logo { width: 82px; height: 82px; }
    .category { font-size: 1rem; margin-bottom: 13px; }
    h1 { font-size: clamp(4.15rem, 7.4vw, 8rem); }
    .name { font-size: 1.05rem; margin-top: 16px; }
    .actions {
      grid-area: 3 / 1 / 4 / 2;
      align-self: start;
      margin-top: 12px;
      padding: 14px 20px 52px clamp(38px, 9vw, 155px);
      max-width: 620px;
    }
    .action { min-height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) { .action { transition: none; } }
</style>
</head>
